version: "3.8"

services:
  studio-enfeca:
    image: studio-enfeca:latest
    container_name: studio-enfeca
    ports:
      - "8092:3000"
    env_file:
      - /opt/divstudio/.env.production
    environment:
      PORT: "3000"
      ENFEC_DATA_ROOT: /var/lib/divstudio/data
      ENFEC_SCRATCH_ROOT: /var/lib/divstudio/scratch
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright
      FFMPEG_PATH: /usr/bin/ffmpeg
      KOKORO_TTS_URL: http://kokoro:3333
      KOKORO_VOICE: af_heart
    extra_hosts:
      - "divstudio.enfeca.com:host-gateway"
    volumes:
      - divstudio_data:/var/lib/divstudio/data
      - divstudio_scratch:/var/lib/divstudio/scratch
    depends_on:
      - kokoro
    restart: unless-stopped

  kokoro:
    build: ./deploy/kokoro
    ports:
      - "127.0.0.1:8093:3333"
    environment:
      PORT: "3333"
      HF_HOME: /var/lib/kokoro/hf
      KOKORO_DTYPE: q8
      KOKORO_THREADS: "2"
      KOKORO_MAX_RSS_MB: "1100"
      KOKORO_IDLE_RECYCLE_MIN: "45"
      KOKORO_CACHE_MAX_MB: "512"
    volumes:
      - kokoro_models:/var/lib/kokoro/hf
    mem_limit: 1300m
    memswap_limit: 2g
    restart: unless-stopped

volumes:
  divstudio_data:
  divstudio_scratch:
  kokoro_models:
